name: Analyze intelligence graph

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/analyze_graph.py'
      - '.github/workflows/analyze-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Compute centrality and bridges
        run: python3 scripts/analyze_graph.py
